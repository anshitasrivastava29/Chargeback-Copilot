[project]
name = "chargeback-copilot-backend"
version = "0.1.0"
description = "FastAPI backend for Chargeback Copilot"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"app/services/seed.py" = ["E501"]
"app/services/ai/constants.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
