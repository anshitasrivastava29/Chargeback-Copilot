<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="Chargeback Copilot — an AI-assisted workspace for PayPal chargebacks: triage disputes, assemble evidence, draft responses, and track outcomes."
    />
    <title>Chargeback Copilot · Win more PayPal chargebacks</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      (function () {
        try {
          var stored = localStorage.getItem('cc_theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* storage unavailable: keep the default light theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
